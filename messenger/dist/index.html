<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Messenger — мессенджер Яндекс Практикум" />
    <!--
      CSP через <meta> не поддерживает frame-ancestors — он работает только
      в HTTP-заголовке. Handlebars компилирует шаблоны через new Function(),
      поэтому script-src требует 'unsafe-eval'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self';"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Messenger</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="module" crossorigin src="/assets/index-DypqYbAy.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-FXduMjTO.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
